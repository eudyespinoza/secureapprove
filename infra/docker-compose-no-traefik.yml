# SecureApprove without Traefik - Connect to External Nginx
# This version removes Traefik and connects to existing Nginx network

version: '3.9'

services:
  # MongoDB Primary
  mongodb-primary:
    image: mongo:7
    container_name: secureapprove-mongodb-primary
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"  # External access
    volumes:
      - mongodb_data_primary:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-secureapprove}
    networks:
      - secureapprove-backend
      - nginx-network  # Connect to existing nginx network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: secureapprove-redis-master
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-password}
      --save 900 1
      --save 300 10
      --save 60 10000
      --rdbcompression yes
      --rdbchecksum yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data_master:/data
    networks:
      - secureapprove-backend
      - nginx-network  # Connect to existing nginx network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # API Test Service
  api-test:
    image: node:18-alpine
    container_name: secureapprove-api-test
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
      echo 'const express = require(\"express\");
      const app = express();
      app.use(express.json());
      app.get(\"/health\", (req, res) => res.json({status:\"healthy\",timestamp:new Date()}));
      app.get(\"/\", (req, res) => res.json({message:\"SecureApprove API Test\",version:\"1.0.0\"}));
      app.listen(3001, \"0.0.0.0\", () => console.log(\"API Test running on port 3001\"));' > server.js &&
      npm init -y &&
      npm install express &&
      node server.js
      "
    ports:
      - "3001:3001"  # Direct port access for nginx proxy
    networks:
      - secureapprove-backend
      - nginx-network  # Connect to existing nginx network
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Web Test Service
  web-test:
    image: nginx:alpine
    container_name: secureapprove-web-test
    restart: unless-stopped
    ports:
      - "3000:80"  # Direct port access for nginx proxy
    volumes:
      - ./web-content:/usr/share/nginx/html:ro
    networks:
      - secureapprove-backend
      - nginx-network  # Connect to existing nginx network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: secureapprove-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - secureapprove-monitoring
      - nginx-network  # Connect to existing nginx network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: secureapprove-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - secureapprove-monitoring
      - nginx-network  # Connect to existing nginx network
    depends_on:
      - prometheus

networks:
  secureapprove-backend:
    name: secureapprove-backend
    driver: bridge
  secureapprove-monitoring:
    name: secureapprove-monitoring  
    driver: bridge
  nginx-network:
    name: nginx-network
    external: true  # Connect to existing nginx network

volumes:
  mongodb_data_primary:
  mongodb_config:
  redis_data_master:
  prometheus_data:
  grafana_data: