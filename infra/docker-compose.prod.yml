# Production Infrastructure Configuration

version: '3.9'

services:
  # Traefik Reverse Proxy & Load Balancer
  traefik:
    image: traefik:v3.0
    container_name: secureapprove-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --metrics.prometheus=true
      - --metrics.prometheus.addentrypointslabels=true
      - --metrics.prometheus.addserviceslabels=true
    ports:
      - "8081:80"    # Changed from 80 to 8081 to avoid Nginx conflict
      - "8443:443"   # Changed from 443 to 8443 to avoid Nginx conflict
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs/letsencrypt:/letsencrypt
      - ./logs/traefik:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}"
    networks:
      - traefik
      - monitoring
    environment:
      - TRAEFIK_API_INSECURE=false
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MongoDB Replica Set (Primary)
  mongodb-primary:
    image: mongo:7
    container_name: secureapprove-mongodb-primary
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongodb-keyfile
    ports:
      - "27019:27017"  # Changed to 27019 to avoid conflicts
    volumes:
      - mongodb_data_primary:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/keyfile:/etc/mongodb-keyfile:ro
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # MongoDB Replica Set (Secondary 1)
  mongodb-secondary1:
    image: mongo:7
    container_name: secureapprove-mongodb-secondary1
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongodb-keyfile
    ports:
      - "27020:27017"  # Secondary MongoDB instance on different port
    volumes:
      - mongodb_data_secondary1:/data/db
      - ./mongodb/keyfile:/etc/mongodb-keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    networks:
      - backend
    depends_on:
      - mongodb-primary
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # MongoDB Replica Set (Secondary 2)
  mongodb-secondary2:
    image: mongo:7
    container_name: secureapprove-mongodb-secondary2
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongodb-keyfile
    ports:
      - "27021:27017"  # Secondary2 MongoDB instance on different port
    volumes:
      - mongodb_data_secondary2:/data/db
      - ./mongodb/keyfile:/etc/mongodb-keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    networks:
      - backend
    depends_on:
      - mongodb-primary
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis Cluster (Master)
  redis-master:
    image: redis:7-alpine
    container_name: secureapprove-redis-master
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --save 900 1
      --save 300 10
      --save 60 10000
      --rdbcompression yes
      --rdbchecksum yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "6379:6379"
    volumes:
      - redis_data_master:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis Sentinel for HA
  redis-sentinel:
    image: redis:7-alpine
    container_name: secureapprove-redis-sentinel
    restart: unless-stopped
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - backend
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SecureApprove API (Multiple instances for HA)
  api-1:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
    container_name: secureapprove-api-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb-primary:27017,mongodb-secondary1:27017,mongodb-secondary2:27017/${MONGODB_DB_NAME}?replicaSet=rs0&authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-master:6379
      - JWT_SECRET=${JWT_SECRET}
      - WEBAUTHN_RP_ID=${DOMAIN}
      - WEBAUTHN_ORIGIN=https://${DOMAIN}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ./certs:/certs:ro
      - ./logs/api:/logs
    networks:
      - backend
      - traefik
    depends_on:
      - mongodb-primary
      - redis-master
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=30s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  api-2:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
    container_name: secureapprove-api-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb-primary:27017,mongodb-secondary1:27017,mongodb-secondary2:27017/${MONGODB_DB_NAME}?replicaSet=rs0&authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-master:6379
      - JWT_SECRET=${JWT_SECRET}
      - WEBAUTHN_RP_ID=${DOMAIN}
      - WEBAUTHN_ORIGIN=https://${DOMAIN}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ./certs:/certs:ro
      - ./logs/api:/logs
    networks:
      - backend
      - traefik
    depends_on:
      - mongodb-primary
      - redis-master
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SecureApprove Web App
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.prod
    container_name: secureapprove-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN}
      - NEXTAUTH_URL=https://${DOMAIN}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - ./logs/web:/logs
    networks:
      - traefik
    depends_on:
      - api-1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.services.web.loadbalancer.healthcheck.path=/api/health"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: secureapprove-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=auth"

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: secureapprove-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

  # Backup Service
  backup:
    build:
      context: .
      dockerfile: ./infra/backup/Dockerfile
    container_name: secureapprove-backup
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb-primary:27017/${MONGODB_DB_NAME}?authSource=admin
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE}
    volumes:
      - ./backups:/tmp/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    depends_on:
      - mongodb-primary

networks:
  traefik:
    external: true
  backend:
    internal: true
  monitoring:
    internal: true

volumes:
  mongodb_data_primary:
  mongodb_data_secondary1:
  mongodb_data_secondary2:
  mongodb_config:
  redis_data_master:
  prometheus_data:
  grafana_data: